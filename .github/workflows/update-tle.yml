name: Update ISS TLE

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch TLE (CelesTrak, then backup source)
        run: |
          mkdir -p data
          fetch() {
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 20 --max-time 60 \
              -A "OrbitalLens/1.0 (student project)" "$1" -o data/raw.tmp || return 1
            tr -d '\r' < data/raw.tmp > data/raw2.tmp
            L1=$(grep -E '^1 25544' data/raw2.tmp | head -n1)
            L2=$(grep -E '^2 25544' data/raw2.tmp | head -n1)
            [ "${#L1}" -eq 69 ] && [ "${#L2}" -eq 69 ] || return 1
            printf 'ISS (ZARYA)\n%s\n%s\n' "$L1" "$L2" > data/iss-tle.txt
          }
          fetch "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" \
            || fetch "https://api.wheretheiss.at/v1/satellites/25544/tles?format=text" \
            || { echo "All TLE sources failed"; exit 1; }
          rm -f data/raw.tmp data/raw2.tmp

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/iss-tle.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ISS TLE"
            git push
          fi