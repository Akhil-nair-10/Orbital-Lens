name: Update ISS TLE

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLE from CelesTrak
        run: |
          mkdir -p data
          curl -fsS --retry 3 --max-time 30 -A "OrbitalLens/1.0 (student project)" \
            "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" -o data/iss-tle.tmp
          test "$(grep -c '^[12] 25544' data/iss-tle.tmp)" = "2"
          mv data/iss-tle.tmp data/iss-tle.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/iss-tle.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ISS TLE"
            git push
          fi